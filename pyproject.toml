[project]
name = "coachkata-workspace"
version = "0.1.0"
description = "Coach Kata Monorepo Workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "betterproto>=1.2.5",
    "grpcio-tools>=1.62.3",
    "observe",
    "onnx>=1.18.0",
    "onnxruntime>=1.22.1",
    "poethepoet>=0.36.0",
    "psutil>=7.0.0",
    "torch>=2.8.0",
    "torchvision>=0.21.0",
    "transformers>=4.55.2",
]

[tool.uv.workspace]
members = [
    "libraries",
    "services/*"
]

[tool.uv.sources]
coachkata-libraries = { workspace = true }
observe = { workspace = true }

[project.optional-dependencies]
dev = [
    "betterproto2-compiler",
    "deptry",
    "grpc-requests",
    "hatchling",
    "httpx",
    "pyright",
    "pytest-asyncio",
    "pytest-cov",
    "pytest>=7.0.0",
    "ruff",
    "jupyter",
    "notebook",
    "ipykernel",
    "matplotlib",
    "pandas",
    "numpy",
    "mediapipe",
    "opencv-python",
    "scikit-image",
    "onnxruntime>=1.15.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    # SAM 3D Body dependencies
    "pytorch-lightning",
    "pyrender",
    "yacs",
    "einops",
    "timm",
    "dill",
    "rich",
    "hydra-core",
    "hydra-submitit-launcher",
    "hydra-colorlog",
    "pyrootutils",
    "webdataset",
    "chump",
    "networkx==3.2.1",
    "roma",
    "joblib",
    "seaborn",
    "wandb",
    "appdirs",
    "appnope",
    "cython",
    "jsonlines",
    "xtcocotools",
    "loguru",
    "optree",
    "fvcore",
    "pycocotools",
    "tensorboard",
    "huggingface_hub",
    "trimesh",
    "pillow",
    "tqdm",
]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    "**/generated/**",
    "**/node_modules/**",
    "**/.venv/**",
    "**/build/**",
    "**/dist/**",
    "models/sam-3d-body/**",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "E402",  # module level import not at top (needed for path setup in __init__.py)
    "F401",  # unused import (intentional in try/except for optional deps)
    "F821",  # undefined name (common in notebooks where vars defined in other cells)
]

[tool.ruff.lint.isort]
known-first-party = ["coachkata"]

[tool.pytest.ini_options]
testpaths = ["tests", "libraries", "notebooks", "services"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
    "--ignore=services/inference/app/client_test.py",  # Exclude test with missing generated protobuf code
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
norecursedirs = [
    ".venv",
    "build",
    "dist",
    "**/generated",
    "node_modules",
]


[tool.deptry]
ignore = [
    "**/generated/**",
    "**/node_modules/**",
    "**/.venv/**",
    "**/build/**",
    "**/dist/**",
    "models/sam-3d-body/**",  # Exclude entire sam-3d-body directory (external model code)
    "notebooks/**",  # Exclude notebooks (they have their own local modules)
]

[tool.deptry.per_rule_ignores]
# DEP001: Missing dependencies - ignore local modules that aren't package dependencies
DEP001 = [
    "sam_3d_body",  # Local module in models/sam-3d-body/
    "tools",  # Local module in models/sam-3d-body/tools/
    "generated",  # Generated protobuf code
    "server",  # Local module in services/
    "config",  # Local config modules
    "lib",  # Local library modules
    "utils",  # Local utils modules
    "mhr",  # Local module (Momentum Human Rig)
    "onnx_memory_tracking",  # Local module in notebooks/
    "cardiffnlp_sentiment_onnx",  # Local module in notebooks/
    "coackata",  # Local module (typo in package name, but it's local)
    "pickleball_pose_analyzer",  # Local module in libraries/src/
    "flash_attn",  # Optional dependency (flash attention)
    "sam2",  # Optional SAM2 dependency
    "sam3",  # Optional SAM3 dependency
    "torch_npu",  # Optional NPU backend
    "torch_mlu",  # Optional MLU backend
]
# DEP002: Unused dependencies - ignore dev tools and build tools used as CLI tools
DEP002 = [
    "betterproto",  # Used for code generation
    "grpcio-tools",  # Used for protobuf code generation
    "observe",  # Used as service/tool
    "poethepoet",  # Used as CLI tool (poe command)
    "deptry",  # Used as CLI tool
    "ruff",  # Used as CLI tool
    "pyright",  # Used as CLI tool
    "pytest",  # Used as CLI tool
    "pytest-asyncio",  # pytest plugin
    "pytest-cov",  # pytest plugin
    "hatchling",  # Build backend
    "jupyter",  # Used as CLI tool
    "notebook",  # Used as CLI tool
    "ipykernel",  # Jupyter kernel
    "scikit-image",  # May be used conditionally
    "dill",  # May be used for serialization
    "rich",  # May be used for CLI output
    "hydra-core",  # May be used for config management
    "hydra-submitit-launcher",  # Hydra plugin
    "hydra-colorlog",  # Hydra plugin
    "chump",  # May be used conditionally
    "networkx",  # May be used conditionally
    "joblib",  # May be used conditionally
    "seaborn",  # May be used for visualization
    "appdirs",  # May be used for paths
    "appnope",  # macOS-specific, may be used conditionally
    "cython",  # Build tool
    "jsonlines",  # May be used conditionally
    "xtcocotools",  # May be used for evaluation
    "loguru",  # May be used for logging
    "optree",  # May be used conditionally
    "pycocotools",  # May be used for evaluation
    "tensorboard",  # Used as CLI tool
    "onnx",  # May be used conditionally
    "grpc-requests",  # May be used for testing
    "betterproto2-compiler",  # Build tool
]
# DEP003: Transitive dependencies - ignore local modules and packages that should be direct
DEP003 = [
    "tools",  # Local module, not a package
    "pickleball_pose_analyzer",  # Local workspace package
    "coackata",  # Local workspace package
    "detectron2",  # Direct dependency for SAM 3D Body
    "omegaconf",  # Direct dependency for SAM 3D Body
    "moge",  # Direct dependency for FOV estimator
    "braceexpand",  # Direct dependency for data loading
    "grpc",  # Direct dependency via grpcio-tools
    "uvicorn",  # Direct dependency (should be in services/inference)
    "fastapi",  # Direct dependency (should be in services/inference)
    "pydantic",  # Direct dependency (should be in services/inference)
    "yaml",  # Optional dependency (PyYAML), handled with try/except ImportError
]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "Darwin"
typeCheckingMode = "standard"  # Changed from "strict" to "standard" for more practical checking
exclude = [
    "**/generated/**",
    "**/node_modules/**",
    "**/.venv/**",
    "models/sam-3d-body/**",
    "**/.ipynb_checkpoints/**",  # Exclude Jupyter checkpoint files
    "notebooks/**",  # Exclude notebooks directory
]
reportMissingTypeStubs = false  # Don't require type stubs for all packages
reportUnknownMemberType = false  # Allow unknown member types (common with external libs)
reportUnknownVariableType = false  # Allow unknown variable types
reportUnknownArgumentType = false  # Allow unknown argument types
reportUnknownParameterType = false  # Allow unknown parameter types
reportMissingParameterType = false  # Don't require all parameters to be typed
reportUnnecessaryComparison = "warning"  # Downgrade to warning instead of error
reportMissingTypeArgument = "warning"  # Downgrade numpy array type args to warning
reportPossiblyUnboundVariable = "warning"  # Downgrade possibly unbound to warning (common with conditional imports)
reportOptionalMemberAccess = "warning"  # Downgrade optional member access to warning
reportOptionalCall = "warning"  # Downgrade optional call to warning
reportAttributeAccessIssue = "warning"  # Downgrade attribute access issues to warning

[tool.poe.tasks]
generate-code-from-protos = "python scripts/generate_proto.py"
run-inference-server = "bash -c 'cd services/inference && uv run python app/main.py'"
check = "bash scripts/run_checks.sh"
# Ensure workspace packages are installed editable before starting notebooks.
# Keep output visible so install errors surface quickly.
jupyter = "bash -c 'set -e; uv pip install -e ./libraries -e ./services/inference -e ./models && uv run jupyter notebook'"
# Same for lab.
jupyter-lab = "bash -c 'set -e; uv pip install -e ./libraries -e ./services/inference -e ./models && uv run jupyter lab'"
compare-poses = "cd libraries && uv run python src/coackata/compare_image.py"

[dependency-groups]
dev = [
    "deptry>=0.23.1",
    "ipykernel>=6.30.1",
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "ruff>=0.9.10",
]
